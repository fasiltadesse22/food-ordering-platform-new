name: Verify Food Ordering Platform
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven root verification
        run: mvn -B -ntp verify
      - name: Confirm packaged runnable jar
        run: test -f target/food-ordering-platform-0.1.0-SNAPSHOT.jar
